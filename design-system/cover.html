<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0}
  body{background:var(--color-content-bg);font-family:ui-sans-serif,system-ui,sans-serif}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--color-content-bg)}
  .art{position:absolute;left:480px;top:0;width:480px;height:288px}
  .nav{fill:var(--color-navigator-bg)}
  .p5{fill:var(--color-primary-500)}
  .p9{fill:var(--color-primary-900)}
  .fill{fill:var(--color-content-fill)}
  .s5{fill:var(--color-secondary-500)}
  .rule{stroke:var(--color-content-border);stroke-width:1}
  .text{position:absolute;left:40px;bottom:36px;max-width:440px}
  .name{margin:0;font-size:120px;line-height:.92;font-weight:700;color:var(--color-content);letter-spacing:-0.02em}
  .tag{margin:14px 0 0;font-size:14px;line-height:20px;color:var(--color-label)}
</style>
</head>
<body>
<div class="cover">
  <svg class="art" viewBox="0 0 480 288" aria-hidden="true">
    <!--
      blocks: color-navigator-bg 480x112, color-primary-500 336x56, color-primary-900 144x56, color-content-fill 480x56, color-secondary-500 88x64
      arrangement: a stack of full-width horizontal bands bleeding off the top and right, square corners
      pattern: bands — Lux's default container is a full-width region separated by one 1px color-content-border line, so three hairline rows close the stack
      scales: band heights are multiples of spacing (0.25rem at 14px root, rounded to 8px steps); no radius, as bands carry none
    -->
    <rect class="nav" x="0" y="0" width="480" height="112"/>
    <rect class="p5" x="0" y="112" width="336" height="56"/>
    <rect class="p9" x="336" y="112" width="144" height="56"/>
    <rect class="fill" x="0" y="168" width="480" height="56"/>
    <rect class="s5" x="392" y="224" width="88" height="64"/>
    <line class="rule" x1="0" y1="224.5" x2="392" y2="224.5"/>
    <line class="rule" x1="0" y1="255.5" x2="392" y2="255.5"/>
    <line class="rule" x1="0" y1="286.5" x2="392" y2="286.5"/>
  </svg>
  <div class="text">
    <h1 class="name">Lux</h1>
    <p class="tag">The visual language of Canexer and the Nimbox applications.</p>
  </div>
</div>
</body>
</html>
